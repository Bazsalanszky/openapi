openapi: 3.0.0
info:
  title: WebConsole NFConfig API
  version: 1.0.0
  description: API for managing access, mobility, policy, session and PLMN information.
servers:
  - url: https://localhost:5001
paths:
  /nfconfig/access-mobility:
    get:
      summary: Get Access and Mobility Configuration
      responses:
        '200':
          description: List of access and mobility configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessAndMobility'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
  /nfconfig/plmn:
    get:
      summary: Get PLMN ID Configuration
      responses:
        '200':
          description: List of PLMN IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlmnId'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
  /nfconfig/plmn-snssai:
    get:
      summary: Get PLMN-SNSSAI Configuration
      responses:
        '200':
          description: List of PLMN-SNSSAI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlmnSnssai'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
  /nfconfig/policy-control:
    get:
      summary: Get Policy Control Configuration
      responses:
        '200':
          description: List of policy control configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyControl'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
  /nfconfig/session-management:
    get:
      summary: Get Session Management Configuration
      responses:
        '200':
          description: List of session management configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionManagement'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
  /nfconfig/qos/{dnn}/{imsi}:
    get:
      summary: Get QoS for given IMSI and DNN
      parameters:
        - in: path
          name: dnn
          schema:
            type: string
          required: true
          description: Data Network Name
        - in: path
          name: imsi
          schema:
            type: string
          required: true
          description: IMSI in format “imsi-” followed by 15 or 16 digits
      responses:
        '200':
          description: Subscriber's QoS configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImsiQos'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
components:
  schemas:
    AccessAndMobility:
      type: object
      required:
        - plmnId
        - snssai
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        snssai:
          $ref: '#/components/schemas/Snssai'
        tacs:
          type: array
          items:
            type: string
    PlmnId:
      type: object
      required:
        - mcc
        - mnc
      properties:
        mcc:
          type: string
        mnc:
          type: string
    Snssai:
      type: object
      required:
        - sst
      properties:
        sst:
          type: integer
        sd:
          type: string
    PlmnSnssai:
      type: object
      required:
        - plmnId
        - sNssaiList
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        sNssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
    PolicyControl:
      type: object
      required:
        - plmnId
        - snssai
        - dnns
        - pccRules
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        snssai:
          $ref: '#/components/schemas/Snssai'
        dnns:
          type: array
          items:
            type: string
        pccRules:
          type: array
          items:
            $ref: '#/components/schemas/PccRule'
    PccRule:
      type: object
      required:
        - ruleId
        - flows
        - qos
        - precedence
      properties:
        ruleId:
          type: string
        flows:
          type: array
          items:
            $ref: '#/components/schemas/PccFlow'
        qos:
          $ref: '#/components/schemas/PccQos'
        precedence:
          type: integer
    PccFlow:
      type: object
      required:
        - description
        - direction
        - status
      properties:
        description:
          type: string
        direction:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/Status'
    PccQos:
      type: object
      required:
        - fiveQi
        - arp
      properties:
        fiveQi:
          type: integer
        maxBrUl:
          type: string
        maxBrDl:
          type: string
        gbrUl:
          type: string
        gbrDl:
          type: string
        arp:
          $ref: '#/components/schemas/Arp'
    Arp:
      type: object
      required:
        - priorityLevel
        - preemptCap
        - preemptVuln
      properties:
        priorityLevel:
          type: integer
        preemptCap:
          $ref: '#/components/schemas/PreemptCap'
        preemptVuln:
          $ref: '#/components/schemas/PreemptVuln'
    ImsiQos:
      type: object
      required:
        - mbrUplink
        - mbrDownlink
        - fiveQi
        - arpPriorityLevel
      properties:
        mbrUplink:
          type: string
        mbrDownlink:
          type: string
        fiveQi:
          type: integer
        arpPriorityLevel:
          type: integer
    SessionManagement:
      type: object
      required:
        - sliceName
        - plmnId
        - snssai
      properties:
        sliceName:
          type: string
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        snssai:
          $ref: '#/components/schemas/Snssai'
        ipDomain:
          type: array
          items:
            $ref: '#/components/schemas/IpDomain'
        upf:
          $ref: '#/components/schemas/Upf'
        gnbNames:
          type: array
          items:
            type: string
    IpDomain:
      type: object
      required:
        - dnnName
        - dnsIpv4
        - ueSubnet
        - mtu
      properties:
        dnnName:
          type: string
        dnsIpv4:
          type: string
          description: IPv4 DNS server address for the UEs of this DNN. An IPv6-only DNN sets it to the empty string.
        pcscfIpv4:
          type: string
        ueSubnet:
          type: string
          description: IPv4 UE address pool in CIDR notation, for example 172.250.0.0/16. An IPv6-only DNN sets it to the empty string.
        mtu:
          type: integer
        ueSubnetIpv6:
          type: string
          description: IPv6 pool in CIDR notation, for example 2001:db8:100::/56, from which one prefix of ueIpv6PrefixLength bits is assigned to each IPv6 or IPv4v6 PDU session. Absent when the DNN has no IPv6 sessions.
        ueIpv6PrefixLength:
          type: integer
          minimum: 1
          maximum: 64
          description: Length of the prefix assigned to each UE out of ueSubnetIpv6. It must not be shorter than the ueSubnetIpv6 prefix length. When absent, 64 is used.
        dnsIpv6:
          type: string
          description: IPv6 DNS server address for the UEs of this DNN.
        pcscfIpv6:
          type: string
          description: IPv6 P-CSCF address for the UEs of this DNN.
    Upf:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
    Status:
      type: string
      enum:
        - ENABLED-UPLINK
        - ENABLED-DOWNLINK
        - ENABLED
        - DISABLED
        - REMOVED
    Direction:
      type: string
      enum:
        - DOWNLINK
        - UPLINK
        - BIDIRECTIONAL
        - UNSPECIFIED
    PreemptCap:
      type: string
      enum:
        - NOT_PREEMPT
        - MAY_PREEMPT
    PreemptVuln:
      type: string
      enum:
        - NOT_PREEMPTABLE
        - PREEMPTABLE
